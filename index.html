<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iQuiz Pro Luxury</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="glass-container">
        <div id="category-box">
            <h1 class="premium-text">iQuiz Pro</h1>
            <p class="subtitle">Premium bilimlar platformasi</p>
            <div class="category-grid">
                <div class="cat-card" onclick="startQuiz('it')">💻 IT Sohasidan</div>
                <div class="cat-card" onclick="startQuiz('history')">📜 Tarixiy bilim</div>
                <div class="cat-card" onclick="startQuiz('english')">🇬🇧 English Test</div>
                <div class="cat-card" onclick="startQuiz('programming')">🚀 Dasturlash</div>
            </div>
        </div>

        <div id="quiz-box" class="hidden">
            <div class="progress-container">
                <div class="progress-bar" id="progress"></div>
            </div>
            <header>
                <span id="current-cat" class="category-tag">KATEGORIYA</span>
                <h2 id="question">Savol yuklanmoqda...</h2>
            </header>
            <div class="options" id="options-container"></div>
            <footer>
                <button id="next-btn" class="apple-btn" onclick="nextQuestion()" disabled>Keyingisi</button>
            </footer>
        </div>

        <div id="result-box" class="hidden">
            <h2 class="premium-text">Natijangiz</h2>
            <div class="score-circle"><span id="score">0</span>%</div>
            <p id="feedback">Bilim — eng katta boylik!</p>
            <button onclick="location.reload()" class="apple-btn gold">Bosh sahifa</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
